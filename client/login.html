<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoteChain | Login</title>
<style>
    :root{
        --primary:#0B3D91;
        --primary-dark:#072A63;
        --bg:#F4F7FB;
        --card:#FFFFFF;
        --text:#1F2937;
        --muted:#6B7280;
        --border:#D1D5DB;
        --shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    body{
        font-family:Arial, sans-serif;
        background:var(--bg);
        color:var(--text);
    }

    .page{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
    }

    .card{
        width:100%;
        max-width:430px;
        background:var(--card);
        border-radius:18px;
        box-shadow:var(--shadow);
        padding:35px 28px;
        border:1px solid var(--border);
    }

    h1{
        text-align:center;
        color:var(--primary);
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        color:var(--muted);
        margin-bottom:25px;
        font-size:0.95rem;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
    }

    input{
        width:100%;
        padding:13px 14px;
        border:1px solid var(--border);
        border-radius:10px;
        margin-bottom:18px;
        font-size:1rem;
        outline:none;
    }

    input:focus{
        border-color:var(--primary);
    }

    .btn{
        width:100%;
        padding:13px;
        border:none;
        border-radius:10px;
        background:var(--primary);
        color:white;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
    }

    .btn:hover{
        background:var(--primary-dark);
    }

    .links{
        margin-top:18px;
        text-align:center;
        font-size:0.95rem;
    }

    .links a{
        color:var(--primary);
        text-decoration:none;
        font-weight:600;
    }

    .links p{
        margin-top:10px;
    }

    .message{
        display:none;
        margin-bottom:18px;
        padding:12px 14px;
        border-radius:10px;
        font-size:0.95rem;
        font-weight:600;
    }

    .message.success{
        display:block;
        background:#dcfce7;
        color:#166534;
        border:1px solid #86efac;
    }

    .message.error{
        display:block;
        background:#fee2e2;
        color:#991b1b;
        border:1px solid #fca5a5;
    }
</style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>Login</h1>
        <p class="subtitle">Access your VoteChain account</p>

    <div id="messageBox" class="message"></div>

    <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" required />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required />

        <button class="btn" type="submit">Login</button>
    </form>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <p>Don’t have an account? <a href="register.html">Register</a></p>
    </div>
    </div>


<script>
    const loginForm = document.getElementById("loginForm");
    const messageBox = document.getElementById("messageBox");

    loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    messageBox.className = "message";
    messageBox.style.display = "none";

    try {
        const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email,
            password
        })
        });

        const data = await response.json();

        if (response.ok) {
            messageBox.textContent = data.message || "Login successful.";
            messageBox.className = "message success";

            localStorage.setItem("loggedInUser", JSON.stringify(data.user));

        setTimeout(() => {
            window.location.href = "voter-dashboard.html";
        }, 1200);
        } else {
            messageBox.textContent = data.message || "Login failed.";
            messageBox.className = "message error";
        }
    } catch (error) {
        messageBox.textContent = "Unable to connect to server.";
        messageBox.className = "message error";
    }
    });
</script>


</div>

<script src="js/auth.js"></script>
<script>
</script>
</body>
</html>
