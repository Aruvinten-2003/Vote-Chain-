<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoteChain | Voter Dashboard</title>
<style>
    :root{
        --primary:#0B3D91;
        --primary-dark:#072A63;
        --accent:#2ECC71;
        --danger:#E74C3C;
        --bg:#F4F7FB;
        --card:#FFFFFF;
        --text:#1F2937;
        --muted:#6B7280;
        --border:#D1D5DB;
        --shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
        font-family:Arial, sans-serif;
        background:var(--bg);
        color:var(--text);
    }

    .navbar{
        background:white;
        padding:18px 30px;
        box-shadow:0 2px 12px rgba(0,0,0,0.05);
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:16px;
        flex-wrap:wrap;
    }

    .brand{
        color:var(--primary);
        font-size:1.3rem;
        font-weight:700;
    }

    .nav-actions{
        display:flex;
        align-items:center;
        gap:12px;
        flex-wrap:wrap;
    }

    .btn{
        background:var(--primary);
        color:white;
        border:none;
        padding:10px 16px;
        border-radius:10px;
        text-decoration:none;
        font-weight:600;
        cursor:pointer;
    }

    .btn:hover{
        background:var(--primary-dark);
    }

    .container{
        width:min(1200px, 92%);
        margin:30px auto;
    }

    .title-row{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:25px;
        flex-wrap:wrap;
        gap:10px;
    }

    .status-grid{
        display:grid;
        grid-template-columns:repeat(4, 1fr);
        gap:20px;
        margin-bottom:22px;
    }

    .status-card, .candidate-card{
        background:white;
        border-radius:18px;
        padding:22px;
        box-shadow:var(--shadow);
        border:1px solid var(--border);
    }

    .status-card h3{
        color:var(--primary);
        margin-bottom:8px;
    }

    .status-card p{
        color:var(--muted);
        font-weight:600;
    }

    .message{
        display:none;
        margin-bottom:20px;
        padding:14px 16px;
        border-radius:12px;
        font-size:0.95rem;
        font-weight:600;
    }

    .message.success{
        display:block;
        background:#dcfce7;
        color:#166534;
        border:1px solid #86efac;
    }

    .message.error{
        display:block;
        background:#fee2e2;
        color:#991b1b;
        border:1px solid #fca5a5;
    }

    .wallet-panel{
        display:flex;
        gap:16px;
        align-items:center;
        flex-wrap:wrap;
        margin-bottom:30px;
    }

    .wallet-panel .btn{
        min-width:180px;
    }

    .candidate-grid{
        display:grid;
        grid-template-columns:repeat(3, 1fr);
        gap:22px;
    }

    .candidate-img{
        width:100%;
        height:180px;
        background:#dbe7ff;
        border-radius:14px;
        margin-bottom:16px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--primary);
        font-weight:700;
        overflow:hidden;
    }

    .candidate-card h3{
        margin-bottom:6px;
    }

    .candidate-card h4{
        color:var(--primary);
        margin-bottom:10px;
        font-size:0.95rem;
    }

    .candidate-card p{
        color:var(--muted);
        margin-bottom:18px;
        font-size:0.95rem;
    }

    .vote-btn{
        width:100%;
        background:var(--accent);
        color:white;
        border:none;
        padding:12px;
        border-radius:10px;
        font-weight:700;
        cursor:pointer;
    }

    .vote-btn:hover{
        opacity:0.92;
    }

    .wallet-address-card{
        flex:1;
        min-width:260px;
    }

    @media (max-width: 1100px){
        .status-grid{
            grid-template-columns:repeat(2, 1fr);
        }

        .candidate-grid{
            grid-template-columns:repeat(2, 1fr);
        }
    }

    @media (max-width: 700px){
        .status-grid,
        .candidate-grid{
            grid-template-columns:1fr;
        }
    }
</style>
</head>
<body>
<div class="navbar">
    <div class="brand">VoteChain</div>
    <div class="nav-actions">
        <button id="connectWalletBtn" class="btn" type="button">Connect MetaMask</button>
        <button id="logoutBtn" class="btn" type="button">Logout</button>
    </div>
</div>

<div class="container">
    <div class="title-row">
        <div>
            <h1>Voter Dashboard</h1>
            <p>Welcome back, <span id="welcomeUserName">Voter</span></p>
        </div>
    </div>

    <div id="messageBox" class="message"></div>

    <div class="status-grid">
        <div class="status-card">
            <h3>Election Status</h3>
            <p id="currentElectionStatus">Unknown</p>
        </div>

        <div class="status-card">
            <h3>Current Election</h3>
            <p id="currentElectionTitle">No election</p>
        </div>

        <div class="status-card">
            <h3>Wallet Status</h3>
            <p id="walletStatus">Not Connected</p>
        </div>

        <div class="status-card">
            <h3>Vote Status</h3>
            <p id="voteStatus">Not Voted</p>
        </div>
    </div>

    <div class="wallet-panel">
        <div class="status-card" style="flex:1; min-width:260px;">
            <h3>Wallet Address</h3>
            <p id="walletAddressText">No wallet connected</p>
        </div>
    </div>

    <div id="candidateContainer" class="candidate-grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="js/app.js"></script>
<script src="js/contract.js"></script>
<script src="js/wallet.js"></script>
<script src="js/vote.js"></script>

<script>
    const user = requireUserLogin();

    if (user) {
        const welcomeUserName = document.getElementById("welcomeUserName");
        const voteStatus = document.getElementById("voteStatus");

        if (welcomeUserName) {
            welcomeUserName.textContent = user.fullName || "Voter";
        }

        if (voteStatus) {
            voteStatus.textContent = user.hasVoted ? "Voted" : "Not Voted";
        }
    }
</script>
</body>
</html>
