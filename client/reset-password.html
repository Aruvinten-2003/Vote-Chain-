<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoteChain | Reset Password</title>
<style>
    :root{
        --primary:#0B3D91;
        --primary-dark:#072A63;
        --bg:#F4F7FB;
        --card:#FFFFFF;
        --text:#1F2937;
        --muted:#6B7280;
        --border:#D1D5DB;
        --shadow:0 10px 30px rgba(0,0,0,0.08);
        --success:#2ECC71;
        --danger:#E74C3C;
    }

    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }

    body{
        font-family:Arial, sans-serif;
        background:linear-gradient(135deg, #eef4ff 0%, #f7f9fc 100%);
        color:var(--text);
        min-height:100vh;
    }

    .page{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
    }

    .card{
        width:100%;
        max-width:480px;
        background:var(--card);
        border-radius:20px;
        box-shadow:var(--shadow);
        border:1px solid var(--border);
        overflow:hidden;
    }

    .card-top{
        background:linear-gradient(135deg, var(--primary), var(--primary-dark));
        color:white;
        padding:28px 28px 24px;
        text-align:center;
    }

    .card-top h1{
        font-size:1.9rem;
        margin-bottom:8px;
    }

    .card-top p{
        font-size:0.96rem;
        color:#dce7ff;
        line-height:1.5;
    }

    .card-body{
        padding:28px;
    }

    .status-box{
        background:#f6f8fb;
        border:1px solid #e2e8f0;
        color:#475569;
        padding:14px 16px;
        border-radius:12px;
        font-size:0.94rem;
        margin-bottom:22px;
        line-height:1.5;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:700;
        font-size:0.96rem;
    }

    input{
        width:100%;
        padding:13px 14px;
        border:1px solid var(--border);
        border-radius:11px;
        margin-bottom:18px;
        font-size:1rem;
        outline:none;
        transition:0.2s ease;
    }

    input:focus{
        border-color:var(--primary);
        box-shadow:0 0 0 4px rgba(11,61,145,0.08);
    }

    .password-rules{
        margin:-6px 0 18px;
        padding-left:18px;
        color:var(--muted);
        font-size:0.9rem;
        line-height:1.6;
    }

    .btn{
        width:100%;
        padding:13px;
        border:none;
        border-radius:11px;
        background:var(--primary);
        color:white;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        transition:0.25s ease;
    }

    .btn:hover{
        background:var(--primary-dark);
        transform:translateY(-1px);
    }

    .bottom-links{
        margin-top:18px;
        text-align:center;
        font-size:0.95rem;
        color:var(--muted);
    }

    .bottom-links a{
        color:var(--primary);
        text-decoration:none;
        font-weight:700;
    }

    .message{
        display:none;
        margin-bottom:18px;
        padding:12px 14px;
        border-radius:10px;
        font-size:0.95rem;
        font-weight:600;
    }

    .message.success{
        display:block;
        background:#dcfce7;
        color:#166534;
        border:1px solid #86efac;
    }

    .message.error{
        display:block;
        background:#fee2e2;
        color:#991b1b;
        border:1px solid #fca5a5;
    }

    @media (max-width: 520px){
    .card-top,
    .card-body{
        padding:22px;
    }

    .card-top h1{
        font-size:1.6rem;
    }
    }
</style>
</head>
<body>
<div class="page">
    <div class="card">
    <div class="card-top">
        <h1>Reset Password</h1>
        <p>Create a new password to regain access to your VoteChain account.</p>
    </div>

    <div class="card-body">
        <div class="status-box">
            Please enter a strong new password and confirm it before submission.
        </div>

        <div id="messageBox" class="message"></div>

        <form id="resetPasswordForm">
            <label for="resetToken">Reset Token</label>
            <input id="resetToken" type="text" placeholder="Enter reset token" required />

            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" placeholder="Enter new password" required />

        <ul class="password-rules">
            <li>Use at least 8 characters</li>
            <li>Include letters and numbers</li>
            <li>Avoid using your old password</li>
        </ul>

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" placeholder="Confirm new password" required />

        <button class="btn" type="submit">Reset Password</button>
        </form>

        <div class="bottom-links">
            Return to <a href="login.html">Login</a>
        </div>
    </div>
    </div>
</div>

<script src="js/resetPassword.js"></script>
</body>
</html>
