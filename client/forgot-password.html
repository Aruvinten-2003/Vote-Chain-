<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoteChain | Forgot Password</title>
<style>
    :root{
        --primary:#0B3D91;
        --primary-dark:#072A63;
        --bg:#F4F7FB;
        --card:#FFFFFF;
        --text:#1F2937;
        --muted:#6B7280;
        --border:#D1D5DB;
        --shadow:0 10px 30px rgba(0,0,0,0.08);
        --success:#2ECC71;
    }

    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }

    body{
        font-family:Arial, sans-serif;
        background:linear-gradient(135deg, #eef4ff 0%, #f7f9fc 100%);
        color:var(--text);
        min-height:100vh;
    }

    .page{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
    }

    .card{
        width:100%;
        max-width:460px;
        background:var(--card);
        border-radius:20px;
        box-shadow:var(--shadow);
        border:1px solid var(--border);
        overflow:hidden;
    }

    .card-top{
        background:linear-gradient(135deg, var(--primary), var(--primary-dark));
        color:white;
        padding:28px 28px 24px;
        text-align:center;
    }

    .card-top h1{
        font-size:1.9rem;
        margin-bottom:8px;
    }

    .card-top p{
        font-size:0.96rem;
        color:#dce7ff;
        line-height:1.5;
    }

    .card-body{
        padding:28px;
    }

    .info-box{
        background:#eef5ff;
        border:1px solid #d8e7ff;
        color:#38507a;
        padding:14px 16px;
        border-radius:12px;
        font-size:0.94rem;
        margin-bottom:22px;
        line-height:1.5;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:700;
        font-size:0.96rem;
    }

    input{
        width:100%;
        padding:13px 14px;
        border:1px solid var(--border);
        border-radius:11px;
        margin-bottom:18px;
        font-size:1rem;
        outline:none;
        transition:0.2s ease;
    }

    input:focus{
        border-color:var(--primary);
        box-shadow:0 0 0 4px rgba(11,61,145,0.08);
    }

    .btn{
        width:100%;
        padding:13px;
        border:none;
        border-radius:11px;
        background:var(--primary);
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        transition:0.25s ease;
    }

    .btn:hover{
        background:var(--primary-dark);
        transform:translateY(-1px);
    }

    .bottom-links{
        margin-top:18px;
        text-align:center;
        font-size:0.95rem;
        color:var(--muted);
    }

    .bottom-links a{
        color:var(--primary);
        text-decoration:none;
        font-weight:700;
    }

    .demo-note{
        margin-top:16px;
        font-size:0.88rem;
        color:var(--muted);
        text-align:center;
    }

    .message{
        display:none;
        margin-bottom:18px;
        padding:12px 14px;
        border-radius:10px;
        font-size:0.95rem;
        font-weight:600;
    }

    .message.success{
        display:block;
        background:#dcfce7;
        color:#166534;
        border:1px solid #86efac;
    }

    .message.error{
        display:block;
        background:#fee2e2;
        color:#991b1b;
        border:1px solid #fca5a5;
    }

    @media (max-width: 520px){
        .card-top,
        .card-body{
        padding:22px;
    }

    .card-top h1{
        font-size:1.6rem;
    }
    }
</style>
</head>
<body>
<div class="page">
    <div class="card">
    <div class="card-top">
        <h1>Forgot Password</h1>
        <p>Enter your registered email address and we will send you a reset link.</p>
    </div>

    <div class="card-body">
        <div class="info-box">
            This page helps voters and administrators recover account access securely.
        </div>

        <div id="messageBox" class="message"></div>

        <form id="forgotPasswordForm">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="Enter your registered email" required />

        <button class="btn" type="submit">Send Reset Link</button>
        </form>

        <div class="bottom-links">
            Remember your password? <a href="login.html">Back to Login</a>
        </div>

        <div class="demo-note">
            Demo UI only — backend email/reset token logic can be connected later.
        </div>
    </div>
    </div>
</div>
<script src="js/forgotPassword.js"></script>
</body>
</html>
