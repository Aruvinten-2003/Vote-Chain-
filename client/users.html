<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoteChain | Users</title>
<style>
    :root{
        --primary:#0B3D91;
        --primary-dark:#072A63;
        --bg:#F4F7FB;
        --card:#FFFFFF;
        --text:#1F2937;
        --muted:#6B7280;
        --border:#D1D5DB;
        --shadow:0 10px 30px rgba(0,0,0,0.08);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
    .sidebar{background:var(--primary-dark);color:white;padding:25px 20px;}
    .sidebar h2{margin-bottom:30px;}
    .sidebar a,.sidebar button{
        display:block;width:100%;color:white;text-decoration:none;margin-bottom:14px;
        padding:10px 12px;border-radius:10px;background:transparent;border:none;
        text-align:left;cursor:pointer;font-size:1rem;
    }
    .sidebar a:hover,.sidebar button:hover{background:rgba(255,255,255,0.12);}
    .main{padding:30px;}
    .card{
        background:white;border-radius:18px;padding:22px;
        box-shadow:var(--shadow);border:1px solid var(--border);
    }
    .message{
        display:none;margin-bottom:20px;padding:14px 16px;border-radius:12px;
        font-size:0.95rem;font-weight:600;
    }
    .message.success{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac;}
    .message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
    table{width:100%;border-collapse:collapse;margin-top:15px;}
    table th,table td{padding:12px;border-bottom:1px solid var(--border);text-align:left;}
    table th{color:var(--primary);}
    @media (max-width:1100px){.layout{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>VoteChain Admin</h2>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-dashboard.html">Manage Elections</a>
        <a href="admin-dashboard.html">Manage Candidates</a>
        <a href="users.html">Users</a>
        <a href="vote-records.html">Vote Records</a>
        <a href="results.html">Results</a>
        <button id="adminLogoutBtn" type="button">Logout</button>
    </aside>

    <main class="main">
        <h1>Users</h1>
        <p style="margin:8px 0 20px;color:#6B7280;">Registered voters and admins</p>

        <div id="messageBox" class="message"></div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Wallet Address</th>
                        <th>Has Voted</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script>
requireAdminLogin();

async function loadUsers() {
    const tableBody = document.getElementById("usersTableBody");
    const messageBox = document.getElementById("messageBox");

    try {
        const response = await fetch("http://localhost:5000/api/auth/users");
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Failed to load users");
        }

        const users = data.users || [];

        if (users.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center;">No users found.</td>
                </tr>
            `;
            return;
        }

        tableBody.innerHTML = users.map(user => `
            <tr>
                <td>${user.fullName || "-"}</td>
                <td>${user.email || "-"}</td>
                <td>${user.role || "-"}</td>
                <td>${user.walletAddress || "-"}</td>
                <td>${user.hasVoted ? "Yes" : "No"}</td>
            </tr>
        `).join("");
    } catch (error) {
        messageBox.textContent = error.message || "Unable to load users";
        messageBox.className = "message error";
        messageBox.style.display = "block";
    }
}

document.addEventListener("DOMContentLoaded", loadUsers);
</script>
</body>
</html>
